experiment:
  name: "exp2_held_out_generalization"
  description: "Evaluate zero-shot transfer from Seen languages to Held-Out Dravidian languages"

target_languages:
  - "tamil"
  - "telugu"
  - "kannada"
  - "malayalam"

metrics:
  - "auroc"
  - "eer"
  - "balanced_accuracy"
  - "macro_f1"

bootstrap:
  n_resamples: 1000
  confidence_level: 0.95
